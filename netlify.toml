# Netlify 배포 설정. Site settings → Environment variables 에 VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY 를 넣어 주세요.
[build]
  command = "npm run build"
  publish = "apps/web/dist"
  # 크레딧 절약: 커밋 메시지에 [deploy] 가 있을 때만 빌드·배포한다(0 = 건너뜀, 1 = 빌드).
  ignore = "git log -1 --pretty=%B | grep -qF '[deploy]' && exit 1 || exit 0"

[build.environment]
  NODE_VERSION = "22"

# SPA 라우팅: 새로고침해도 index.html 로
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"

# 서비스 워커는 항상 새로 받아야 업데이트가 바로 퍼진다
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
